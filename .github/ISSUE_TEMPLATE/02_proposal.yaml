# Adapted from the dotnet/runtime repository
name: Feature Suggestion
description: Propose adding a new feature or update an existing feature
title: "[Proposal]: "
labels: [proposal]
body:
    - type: markdown
      attributes:
          value: |
              We welcome proposals! We have a process to evaluate the value and shape of new APIs. This template will help us gather the information we need to start the review process.
    - type: textarea
      id: background
      attributes:
          label: Background and motivation
          description: Please describe the purpose and value of the new feature here.
          placeholder: Purpose
      validations:
          required: true
    - type: textarea
      id: proposal
      attributes:
          label: Proposal
          description: |
              Please provide the specific public API signature diff that you are proposing.

          placeholder: Example
          value: |
              ```csharp
              namespace System.Collections.Generic;

              public class MyFancyCollection<T> : IEnumerable<T>
              {
                  public void Fancy(T item);
              }
              ```
      validations:
          required: true
    - type: textarea
      id: api-usage
      attributes:
          label: API Usage
          description: |
              Please provide code examples that highlight how the proposed API additions are meant to be consumed. This will help suggest whether the API has the right shape to be functional, performant and usable.
          placeholder: API usage
          value: |
              ```csharp
              // Fancy the value
              var c = new MyFancyCollection<int>();
              c.Fancy(42);

              // Getting the values out
              foreach (var v in c)
                  Console.WriteLine(v);
              ```
      validations:
          required: true
    - type: textarea
      id: alternative-designs
      attributes:
          label: Alternative Designs
          description: |
              Please provide alternative designs. This might not be APIs; for example instead of providing new APIs an option might be to change the behavior of an existing API.
          placeholder: Alternative designs
      validations:
          required: false
    - type: textarea
      id: risks
      attributes:
          label: Risks
          description: |
              Please mention any risks that to your knowledge the API proposal might entail, such as breaking changes, performance regressions, etc.
          placeholder: Risks
      validations:
          required: false
